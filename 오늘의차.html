<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>오늘의 차</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      min-height: 100vh; -webkit-font-smoothing: antialiased;
      transition: background 1.8s ease;
    }

    /* ── 시간대별 테마 (연한 녹색 계열) ── */
    body.morning {
      background: linear-gradient(155deg, #f0faf0 0%, #d4f0d4 45%, #a8dca8 100%);
      --text: #1a3a1a; --sub: #4a7a4a; --subsub: #6a9a6a;
      --card: rgba(255,255,255,0.54); --card-b: rgba(255,255,255,0.78);
      --active: #2e7a2e; --active-t: #fff;
      --pill: rgba(255,255,255,0.56); --pill-h: rgba(255,255,255,0.76);
      --shadow: rgba(30,90,30,0.14); --dot-off: rgba(46,122,46,0.2);
    }
    body.afternoon {
      background: linear-gradient(155deg, #f4fbf4 0%, #c8e8c8 45%, #8cca8c 100%);
      --text: #142814; --sub: #3a6a3a; --subsub: #5a8a5a;
      --card: rgba(255,255,255,0.50); --card-b: rgba(255,255,255,0.74);
      --active: #257025; --active-t: #fff;
      --pill: rgba(255,255,255,0.52); --pill-h: rgba(255,255,255,0.72);
      --shadow: rgba(25,85,25,0.13); --dot-off: rgba(37,112,37,0.2);
    }
    body.evening {
      background: linear-gradient(155deg, #eef8ee 0%, #c0e0c0 45%, #7ab87a 100%);
      --text: #102010; --sub: #386038; --subsub: #587858;
      --card: rgba(255,255,255,0.40); --card-b: rgba(255,255,255,0.62);
      --active: #2e6a2e; --active-t: #fff;
      --pill: rgba(255,255,255,0.44); --pill-h: rgba(255,255,255,0.62);
      --shadow: rgba(20,80,20,0.16); --dot-off: rgba(46,106,46,0.2);
    }
    body.night {
      background: linear-gradient(155deg, #080e08 0%, #101e10 50%, #182814 100%);
      --text: #c8e8c8; --sub: #78a878; --subsub: #98c898;
      --card: rgba(255,255,255,0.07); --card-b: rgba(255,255,255,0.13);
      --active: #3a7a3a; --active-t: #fff;
      --pill: rgba(255,255,255,0.09); --pill-h: rgba(255,255,255,0.16);
      --shadow: rgba(10,60,10,0.3); --dot-off: rgba(58,122,58,0.25);
    }

    /* ── 레이아웃 ── */
    .wrap { min-height: 100vh; padding-bottom: 72px; }
    .container { max-width: 540px; margin: 0 auto; padding: 0 18px; }

    /* ── 헤더 ── */
    .hdr { padding: 52px 18px 20px; text-align: center; }
    .hdr-time {
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--sub); margin-bottom: 14px; font-weight: 400;
    }
    .hdr-title {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(30px, 8.5vw, 46px); font-weight: 600;
      color: var(--text); line-height: 1.15; margin-bottom: 10px;
    }
    .hdr-sub { font-size: 14px; font-weight: 300; color: var(--sub); line-height: 1.75; }

    /* ── 진행 표시 ── */
    .progress-wrap { padding: 24px 18px 8px; display: flex; justify-content: center; gap: 6px; align-items: center; }
    .pdot {
      height: 5px; border-radius: 3px; background: var(--dot-off);
      transition: all .4s cubic-bezier(.4,0,.2,1);
      width: 20px;
    }
    .pdot.done { background: var(--active); width: 32px; }
    .pdot.active { background: var(--active); opacity: .5; }
    .prog-label {
      font-size: 11px; color: var(--sub); letter-spacing: .1em;
      margin-left: 10px; font-weight: 400;
    }

    /* ── 선택 카드 ── */
    .card {
      background: var(--card);
      border: 1px solid var(--card-b);
      border-radius: 22px;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      padding: 20px 18px 20px;
      margin-bottom: 12px;
      box-shadow: 0 4px 24px var(--shadow);
      transition: box-shadow .3s;
    }
    .card.filled { box-shadow: 0 4px 24px var(--shadow), inset 0 0 0 1.5px var(--active); }
    .card-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .card-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      background: var(--active); color: var(--active-t);
      font-size: 11px; font-weight: 600;
    }
    .card-num.done { background: var(--active); opacity: 1; }
    .card-lbl {
      font-size: 12px; font-weight: 500; letter-spacing: .14em;
      text-transform: uppercase; color: var(--sub);
    }
    .card-sel {
      font-size: 12px; font-weight: 400; color: var(--active);
      margin-left: auto; opacity: 0; transition: opacity .3s;
    }
    .card.filled .card-sel { opacity: 1; }

    /* ── 옵션 버튼 ── */
    .opts { display: flex; flex-wrap: wrap; gap: 7px; }
    .opt {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 9px 15px; border-radius: 50px;
      border: 1.5px solid var(--card-b);
      background: var(--pill); color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13.5px; cursor: pointer;
      transition: all .2s ease; -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .opt:hover { background: var(--pill-h); transform: translateY(-1px); }
    .opt:active { transform: scale(.95); }
    .opt.on {
      background: var(--active); border-color: var(--active);
      color: var(--active-t); font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transform: translateY(-1px);
    }
    .opt-ic { font-size: 15px; line-height: 1; }

    /* ── CTA ── */
    .cta-wrap { padding: 6px 18px 0; }
    .cta {
      width: 100%; padding: 18px; border-radius: 16px; border: none;
      background: var(--active); color: #fff;
      font-family: 'Noto Serif KR', serif; font-size: 17px; font-weight: 600;
      letter-spacing: .04em; cursor: pointer;
      transition: all .25s; box-shadow: 0 6px 24px var(--shadow);
      -webkit-tap-highlight-color: transparent;
      position: relative; overflow: hidden;
    }
    .cta::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
    }
    .cta:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 10px 32px var(--shadow); }
    .cta:active:not(:disabled) { transform: scale(.98); }
    .cta:disabled { opacity: .42; cursor: not-allowed; transform: none; filter: none; }

    /* ── 결과 ── */
    #result { padding: 0 18px; margin-top: 12px; }
    .res-card {
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 16px 56px var(--shadow);
      animation: slideUp .65s cubic-bezier(.16,1,.3,1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(48px) scale(.94); }
      to   { opacity: 1; transform: none; }
    }

    /* 결과 헤더 */
    .res-hdr { padding: 38px 28px 30px; position: relative; overflow: hidden; }
    .res-hdr::before {
      content: ''; position: absolute; top: -60px; right: -60px;
      width: 240px; height: 240px; border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    .res-hdr::after {
      content: ''; position: absolute; bottom: -40px; left: -40px;
      width: 160px; height: 160px; border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }
    .steam-wrap { display: flex; gap: 5px; align-items: flex-end; height: 24px; margin-bottom: 8px; position: relative; z-index:1; }
    .steam-bar { width: 3px; border-radius: 3px; background: rgba(255,255,255,0.5); animation: steamUp 2.4s ease-in-out infinite; }
    .steam-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
    .steam-bar:nth-child(2) { height: 17px; animation-delay: .38s; }
    .steam-bar:nth-child(3) { height: 10px; animation-delay: .76s; }
    @keyframes steamUp {
      0%,100% { transform: translateY(0) scaleX(1); opacity: .3; }
      50%      { transform: translateY(-8px) scaleX(1.7); opacity: .9; }
    }
    .tea-emoji { font-size: 56px; line-height:1; display:block; margin-bottom:6px; position:relative;z-index:1; }

    .res-badges { display: flex; gap: 7px; margin-bottom: 12px; position:relative;z-index:1; flex-wrap: wrap; }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 500;
      letter-spacing: .14em; text-transform: uppercase;
      color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.18);
      border-radius: 30px; padding: 4px 12px;
    }

    .tea-kr {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(32px, 9.5vw, 50px); font-weight: 600;
      color: #fff; line-height: 1.1; margin-bottom: 4px;
      position:relative;z-index:1;
    }
    .tea-en { font-size: 13px; font-weight:300; color: rgba(255,255,255,.7); letter-spacing:.1em; margin-bottom:16px; position:relative;z-index:1; }
    .tea-desc { font-size:15px; font-weight:300; color:rgba(255,255,255,.93); line-height:1.8; position:relative;z-index:1; }

    /* 카페인 뱃지 */
    .cf-wrap { display:flex; align-items:center; gap:5px; margin-top:14px; position:relative;z-index:1; }
    .cf-lbl { font-size:11px; color:rgba(255,255,255,.65); font-weight:400; margin-right:2px; }
    .cf-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.2); transition:background .3s; }
    .cf-dot.on { background:rgba(255,255,255,.85); }
    .cf-text { font-size:11px; color:rgba(255,255,255,.6); margin-left:4px; }

    /* 서빙 방식 */
    .serve-wrap { display:flex; gap:7px; margin-top:10px; position:relative;z-index:1; }
    .serve-chip {
      font-size:11px; padding:4px 11px; border-radius:20px;
      background:rgba(255,255,255,.15); color:rgba(255,255,255,.85);
      border:1px solid rgba(255,255,255,.25);
    }

    /* 결과 바디 */
    .res-body {
      background: var(--card);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.14);
      padding: 22px 24px 26px;
    }

    /* 섹션 타이틀 */
    .sec-title {
      font-size: 10px; font-weight:500; letter-spacing:.16em;
      text-transform:uppercase; color:var(--sub); margin-bottom:10px;
    }

    /* 추천 이유 */
    .reason-list { display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
    .reason-item {
      display:flex; gap:10px; align-items:flex-start;
      background:rgba(255,255,255,0.13); border-radius:13px;
      padding:12px 14px; font-size:13.5px; line-height:1.7; color:var(--text);
    }
    .reason-ic { font-size:16px; flex-shrink:0; margin-top:1px; }

    /* 맛 프로필 */
    .flavor-section { margin-bottom:22px; }
    .flavor-row { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
    .flavor-lbl { font-size:12px; color:var(--sub); width:38px; flex-shrink:0; text-align:right; }
    .flavor-track {
      flex:1; height:5px; border-radius:3px;
      background:rgba(0,0,0,0.08);
    }
    body.night .flavor-track { background: rgba(255,255,255,0.1); }
    .flavor-bar {
      height:100%; border-radius:3px; background:var(--active);
      width:0; transition:width .9s cubic-bezier(.4,0,.2,1);
      opacity:.85;
    }
    .flavor-val { font-size:11px; color:var(--subsub); width:22px; text-align:right; flex-shrink:0; }

    /* 우리는 방법 */
    .brew-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:22px; }
    .brew-item { text-align:center; background:rgba(255,255,255,0.12); border-radius:14px; padding:14px 8px; }
    .brew-ic { font-size:20px; margin-bottom:6px; }
    .brew-v { font-size:12.5px; font-weight:500; color:var(--text); margin-bottom:3px; }
    .brew-k { font-size:10px; color:var(--sub); font-weight:300; }

    /* 효능 */
    .benefits { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:22px; }
    .b-tag {
      font-size:12px; padding:5px 13px; border-radius:30px;
      background:rgba(255,255,255,0.15); color:var(--text);
      border:1px solid rgba(255,255,255,0.22);
    }

    /* 페어링 */
    .pairing-box {
      background:rgba(255,255,255,0.12); border-radius:13px;
      padding:13px 16px; margin-bottom:22px;
      font-size:13.5px; color:var(--text); line-height:1.7;
    }
    .pairing-box strong { color:var(--active); font-weight:500; }

    /* 액션 버튼 */
    .res-actions { display:flex; gap:10px; }
    .btn-s {
      flex:1; padding:14px; border-radius:13px;
      border:1.5px solid var(--card-b); background:var(--pill);
      color:var(--text); font-family:'Noto Sans KR',sans-serif;
      font-size:14px; cursor:pointer; transition:all .2s;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-s:hover { background:var(--pill-h); }
    .btn-p {
      flex:1; padding:14px; border-radius:13px; border:none;
      background:var(--active); color:#fff;
      font-family:'Noto Sans KR',sans-serif;
      font-size:14px; font-weight:500; cursor:pointer;
      transition:all .2s; -webkit-tap-highlight-color:transparent;
      position:relative; overflow:hidden;
    }
    .btn-p::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 60%); }
    .btn-p:hover { filter:brightness(1.08); }

    /* 구분선 */
    .divider { height:1px; background:rgba(0,0,0,0.06); margin:0 0 18px; }
    body.night .divider { background:rgba(255,255,255,0.08); }

    /* 푸터 */
    .footer { text-align:center; padding:36px 18px 0; font-size:12px; font-weight:300; color:var(--sub); opacity:.55; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="container">
    <div class="hdr">
      <div class="hdr-time" id="timeLabel">—</div>
      <h1 class="hdr-title">오늘의 차</h1>
      <p class="hdr-sub">지금 이 순간을 위한<br>특별한 한 잔을 찾아드릴게요</p>
    </div>

    <div class="progress-wrap">
      <div class="pdot" id="pd0"></div>
      <div class="pdot" id="pd1"></div>
      <div class="pdot" id="pd2"></div>
      <div class="pdot" id="pd3"></div>
      <div class="pdot" id="pd4"></div>
      <div class="pdot" id="pd5"></div>
      <span class="prog-label" id="progLabel">0 / 6</span>
    </div>

    <!-- 날씨 -->
    <div class="card" id="c0">
      <div class="card-hdr">
        <span class="card-num" id="n0">1</span>
        <span class="card-lbl">날씨</span>
        <span class="card-sel" id="s0"></span>
      </div>
      <div class="opts">
        <button class="opt" data-g="weather" data-v="sunny" data-l="맑음"><span class="opt-ic">☀️</span>맑음</button>
        <button class="opt" data-g="weather" data-v="cloudy" data-l="흐림"><span class="opt-ic">⛅</span>흐림</button>
        <button class="opt" data-g="weather" data-v="rainy" data-l="비"><span class="opt-ic">🌧️</span>비</button>
        <button class="opt" data-g="weather" data-v="snowy" data-l="눈"><span class="opt-ic">❄️</span>눈</button>
        <button class="opt" data-g="weather" data-v="windy" data-l="바람"><span class="opt-ic">🌬️</span>바람</button>
        <button class="opt" data-g="weather" data-v="foggy" data-l="안개"><span class="opt-ic">🌫️</span>안개</button>
      </div>
    </div>

    <!-- 기온 -->
    <div class="card" id="c1">
      <div class="card-hdr">
        <span class="card-num" id="n1">2</span>
        <span class="card-lbl">기온</span>
        <span class="card-sel" id="s1"></span>
      </div>
      <div class="opts">
        <button class="opt" data-g="temp" data-v="hot" data-l="더움"><span class="opt-ic">🔥</span>더움</button>
        <button class="opt" data-g="temp" data-v="warm" data-l="따뜻함"><span class="opt-ic">🌤️</span>따뜻함</button>
        <button class="opt" data-g="temp" data-v="cool" data-l="선선함"><span class="opt-ic">🍃</span>선선함</button>
        <button class="opt" data-g="temp" data-v="cold" data-l="추움"><span class="opt-ic">🧊</span>추움</button>
        <button class="opt" data-g="temp" data-v="veryCold" data-l="매우 추움"><span class="opt-ic">🥶</span>매우 추움</button>
      </div>
    </div>

    <!-- 습도 -->
    <div class="card" id="c2">
      <div class="card-hdr">
        <span class="card-num" id="n2">3</span>
        <span class="card-lbl">습도</span>
        <span class="card-sel" id="s2"></span>
      </div>
      <div class="opts">
        <button class="opt" data-g="humid" data-v="veryDry" data-l="매우 건조"><span class="opt-ic">🏜️</span>매우 건조</button>
        <button class="opt" data-g="humid" data-v="dry" data-l="건조"><span class="opt-ic">💨</span>건조</button>
        <button class="opt" data-g="humid" data-v="normal" data-l="보통"><span class="opt-ic">💧</span>보통</button>
        <button class="opt" data-g="humid" data-v="humid" data-l="습함"><span class="opt-ic">🌊</span>습함</button>
        <button class="opt" data-g="humid" data-v="veryHumid" data-l="매우 습함"><span class="opt-ic">🫧</span>매우 습함</button>
      </div>
    </div>

    <!-- 기분 -->
    <div class="card" id="c3">
      <div class="card-hdr">
        <span class="card-num" id="n3">4</span>
        <span class="card-lbl">지금 기분</span>
        <span class="card-sel" id="s3"></span>
      </div>
      <div class="opts">
        <button class="opt" data-g="mood" data-v="calm" data-l="평온"><span class="opt-ic">😌</span>평온</button>
        <button class="opt" data-g="mood" data-v="focused" data-l="집중"><span class="opt-ic">🎯</span>집중</button>
        <button class="opt" data-g="mood" data-v="energetic" data-l="활기"><span class="opt-ic">✨</span>활기</button>
        <button class="opt" data-g="mood" data-v="creative" data-l="창의적"><span class="opt-ic">🎨</span>창의적</button>
        <button class="opt" data-g="mood" data-v="tired" data-l="피곤"><span class="opt-ic">😪</span>피곤</button>
        <button class="opt" data-g="mood" data-v="stressed" data-l="스트레스"><span class="opt-ic">😤</span>스트레스</button>
        <button class="opt" data-g="mood" data-v="happy" data-l="행복"><span class="opt-ic">😊</span>행복</button>
        <button class="opt" data-g="mood" data-v="sad" data-l="우울"><span class="opt-ic">😢</span>우울</button>
      </div>
    </div>

    <!-- 활동 -->
    <div class="card" id="c4">
      <div class="card-hdr">
        <span class="card-num" id="n4">5</span>
        <span class="card-lbl">지금 뭐 하고 있어요?</span>
        <span class="card-sel" id="s4"></span>
      </div>
      <div class="opts">
        <button class="opt" data-g="activity" data-v="reading" data-l="독서"><span class="opt-ic">📖</span>독서</button>
        <button class="opt" data-g="activity" data-v="working" data-l="집중 업무"><span class="opt-ic">💼</span>집중 업무</button>

const S = { weather:null, temp:null, humid:null, mood:null, activity:null, caff:null };
const GRP = ['weather','temp','humid','mood','activity','caff'];

// ══════════════════════════════════════════════
// 시간대 설정
// ══════════════════════════════════════════════
(function() {
  const h = new Date().getHours();
  let cls, lbl;
  if      (h>=5  && h<12) { cls='morning';   lbl='🌅 아침'; }
  else if (h>=12 && h<18) { cls='afternoon'; lbl='☀️ 낮'; }
  else if (h>=18 && h<22) { cls='evening';   lbl='🌆 저녁'; }
  else                    { cls='night';     lbl='🌙 밤'; }
  document.body.className = cls;
  const d = new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  document.getElementById('timeLabel').textContent = `${lbl}  ·  ${d}`;
})();

const LABEL_MAP = {
  weather:{sunny:'☀️ 맑음',cloudy:'⛅ 흐림',rainy:'🌧️ 비',snowy:'❄️ 눈',windy:'🌬️ 바람',foggy:'🌫️ 안개'},

document.querySelectorAll('.opt').forEach(btn => {
  btn.addEventListener('click', () => {
    const g = btn.dataset.g, v = btn.dataset.v;
    const idx = GRP.indexOf(g);
    document.querySelectorAll(`.opt[data-g="${g}"]`).forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    S[g] = v;
    // update card style
    document.getElementById('c'+idx).classList.add('filled');
    document.getElementById('s'+idx).textContent = LABEL_MAP[g][v] || btn.dataset.l;
    updateProgress();
  });
});

function updateProgress() {
  const filled = GRP.filter(g => S[g]).length;
  GRP.forEach((g, i) => {
    const dot = document.getElementById('pd'+i);
    if (S[g]) dot.className = 'pdot done';
    else if (i === filled) dot.className = 'pdot active';
    else dot.className = 'pdot';
  });
  document.getElementById('progLabel').textContent = `${filled} / 6`;
  const cta = document.getElementById('ctaBtn');
  if (filled === 6) {
    cta.disabled = false;
    cta.textContent = '✦ 오늘의 차 추천받기';
  } else {
    cta.disabled = true;
    cta.textContent = `조건을 모두 선택해 주세요 (${filled}/6)`;
  }
}

// ══════════════════════════════════════════════
// 추천 엔진
// ══════════════════════════════════════════════
const CAFF_SCORE = {
  none:   [6, 2, -3, -6],
  low:    [4, 6,  2, -2],
  medium: [1, 3,  6,  4],
  high:   [-4, 1, 4,  6]
};

function pick() {
  const scored = TEAS.map(t => {
    const cfBonus = S.caff ? (CAFF_SCORE[S.caff][t.caffeine] || 0) : 0;
    return {
      t, n: (t.score.weather[S.weather]||0) + (t.score.temp[S.temp]||0)
           + (t.score.humid[S.humid]||0) + (t.score.mood[S.mood]||0)
           + (t.score.activity[S.activity]||0) + cfBonus
    };
  }).sort((a,b) => b.n - a.n);
  const best = scored[0].n;
  const pool = scored.filter(x => x.n >= best-1).slice(0,2);
  return pool[Math.floor(Math.random()*pool.length)].t;
}

// ══════════════════════════════════════════════
// 카페인 렌더
// ══════════════════════════════════════════════
function cfDots(level) {
  const labels = ['없음','낮음','보통','높음','매우높음'];
  let dots = '';
  for (let i=0;i<4;i++) dots += `<span class="cf-dot${i<level?' on':''}"></span>`;
  return `<div class="cf-wrap"><span class="cf-lbl">카페인</span>${dots}<span class="cf-text">${labels[level]||''}</span></div>`;
}

// ══════════════════════════════════════════════
// 결과 렌더
// ══════════════════════════════════════════════
function show() {
  const tea = pick();
  const wIc = {sunny:'☀️',cloudy:'⛅',rainy:'🌧️',snowy:'❄️',windy:'🌬️',foggy:'🌫️'}[S.weather];
  const mIc = {calm:'😌',focused:'🎯',energetic:'✨',creative:'🎨',tired:'😪',stressed:'😤',happy:'😊',sad:'😢'}[S.mood];
  const aIc = {reading:'📖',working:'💼',resting:'🛋️',afterExercise:'🏃',meditation:'🧘',afterMeal:'🍽️',beforeSleep:'🌙',creative:'🎨'}[S.activity];

  const serveChips = tea.serve.map(s=>`<span class="serve-chip">${s}</span>`).join('');
  const badges = `<span class="badge">${tea.en}</span>`;

  const flavorKeys = ['bitter','sweet','floral','earthy','fresh','citrus'];
  const flavorNames = {bitter:'쓴맛',sweet:'단맛',floral:'꽃향',earthy:'구수',fresh:'상쾌',citrus:'상큼'};
  const flavorBars = flavorKeys.map(k => {
    const v = tea.flavor[k];
    return `<div class="flavor-row">
      <span class="flavor-lbl">${flavorNames[k]}</span>
      <div class="flavor-track"><div class="flavor-bar" data-w="${v}" style="width:0%"></div></div>
      <span class="flavor-val">${v}</span>
    </div>`;
  }).join('');

  const benefitTags = tea.benefits.map(b=>`<span class="b-tag">✓ ${b}</span>`).join('');

  document.getElementById('result').innerHTML = `
    <div class="container">
      <div class="res-card">
        <div class="res-hdr" style="background:${tea.grad}">
          <div class="steam-wrap">
            <div class="steam-bar"></div><div class="steam-bar"></div><div class="steam-bar"></div>
          </div>
          <span class="tea-emoji">${tea.emoji}</span>
          <div class="res-badges">${badges}</div>
          <div class="tea-kr">${tea.name}</div>
          <div class="tea-en">${tea.en}</div>
          <div class="tea-desc">${tea.desc}</div>
          ${cfDots(tea.caffeine)}
          <div class="serve-wrap">${serveChips}</div>
        </div>
        <div class="res-body">

          <div class="sec-title">지금 이 차를 추천하는 이유</div>
          <div class="reason-list">
            <div class="reason-item"><span class="reason-ic">${wIc}</span><span>${tea.why.weather[S.weather]}</span></div>
            <div class="reason-item"><span class="reason-ic">${mIc}</span><span>${tea.why.mood[S.mood]}</span></div>
            <div class="reason-item"><span class="reason-ic">${aIc}</span><span>${tea.why.activity[S.activity]}</span></div>
          </div>

          <div class="divider"></div>
          <div class="sec-title">맛 프로필</div>
          <div class="flavor-section">${flavorBars}</div>

          <div class="divider"></div>
          <div class="sec-title">우리는 방법</div>
          <div class="brew-grid">
            <div class="brew-item"><div class="brew-ic">🌡️</div><div class="brew-v">${tea.brew.temp}</div><div class="brew-k">물 온도</div></div>
            <div class="brew-item"><div class="brew-ic">⏱️</div><div class="brew-v">${tea.brew.time}</div><div class="brew-k">우리는 시간</div></div>
            <div class="brew-item"><div class="brew-ic">🥄</div><div class="brew-v">${tea.brew.amount}</div><div class="brew-k">분량</div></div>
          </div>

          <div class="divider"></div>
          <div class="sec-title">건강 효능</div>
          <div class="benefits">${benefitTags}</div>

          <div class="divider"></div>
          <div class="sec-title">어울리는 음식</div>
          <div class="pairing-box">🍽️ <strong>${tea.pairing}</strong></div>

          <div class="res-actions">
            <button class="btn-s" onclick="window._retry()">🔄 다시 추천</button>
            <button class="btn-p" onclick="window._share('${tea.name}','${tea.en}')">📤 공유하기</button>
          </div>
        </div>
      </div>
    </div>`;

  // flavor bar 애니메이션
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('.flavor-bar').forEach(bar => {
        bar.style.width = bar.dataset.w + '%';
      });
    });
  });

  setTimeout(() => document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'}), 80);
}

window._retry = () => show();
window._share = (kr, en) => {
  const txt = `오늘의 차 추천: ${kr} (${en}) 🍵\n지금 이 순간을 위한 특별한 한 잔 ☕`;
  if (navigator.share) navigator.share({title:'오늘의 차', text:txt});
  else navigator.clipboard.writeText(txt).then(()=>alert('클립보드에 복사됐어요! ✓'));
};

document.getElementById('ctaBtn').addEventListener('click', () => {
  if (GRP.every(g => S[g])) show();
});
</script>
</body>
